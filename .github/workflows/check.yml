# Runs the tests and builds the website on every push and pull request.
name: Check

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Shell tests
        working-directory: shell
        run: npm ci --ignore-scripts && npm test
      - name: Install engine unit tests
        shell: pwsh
        run: ./windows/engine/tests/engine.tests.ps1
      - name: Website build
        run: npm ci --prefix web && npm run build --prefix web
